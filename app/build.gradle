plugins { id 'com.android.application' }
android {
 namespace 'ru.oopssre.gremlinamp'
 compileSdk 35
 ndkVersion '27.0.12077973'
 defaultConfig {
  applicationId 'ru.oopssre.gremlinamp'
  minSdk 26
  targetSdk 35
  versionCode 11
  versionName '0.2.1'
  externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DGME_BUILD_EXAMPLES=OFF', '-DGME_BUILD_TESTING=OFF', '-DGME_BUILD_SHARED=OFF', '-DGME_BUILD_STATIC=ON', '-DGME_ZLIB=ON' } }
  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
