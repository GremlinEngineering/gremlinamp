plugins { id 'com.android.application' }

android {
 androidResources {
  ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:!<dir>site-engine:!<dir>decoder-host'
 }
    namespace 'ru.oopssre.gremlinamp'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'ru.oopssre.gremlinamp.tv'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '0.1.18'
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DGME_BUILD_EXAMPLES=OFF', '-DGME_BUILD_TESTING=OFF', '-DGME_BUILD_SHARED=OFF', '-DGME_BUILD_STATIC=ON', '-DGME_ZLIB=ON' } }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    externalNativeBuild { cmake { path '../app/src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets.main {
        java.srcDirs += ['../app/src/main/java']
        res.srcDirs += ['../app/src/main/res']
        assets.srcDirs += ['../app/src/main/assets']
    }
    buildTypes.configureEach {
     minifyEnabled true
     proguardFiles getDefaultProguardFile('proguard-android.txt'), '../app/proguard-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

if (!file('../app/src/main/assets/space/voyager-plasma.pcm').isFile()) {
    def voyagerAssets = layout.buildDirectory.dir('generated/voyager-assets')
    def prepareVoyagerAudio = tasks.register('prepareVoyagerAudio', Exec) {
        def destination = voyagerAssets.get().file('space/voyager-plasma.pcm').asFile
        inputs.file(rootProject.file('tools/prepare-voyager-audio.sh'))
        outputs.file(destination)
        commandLine 'bash', rootProject.file('tools/prepare-voyager-audio.sh'), destination
    }
    android.sourceSets.main.assets.srcDir(voyagerAssets)
    tasks.named('preBuild').configure { dependsOn prepareVoyagerAudio }
}

dependencies {
    implementation "androidx.core:core:1.8.0"
    implementation "androidx.media3:media3-exoplayer:1.8.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.8.1"
    implementation "androidx.media3:media3-datasource-okhttp:1.8.1"
}
