name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      decoder_bundle_url:
        description: "HTTPS URL for the checked music_player.zip"
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - uses: android-actions/setup-android@v3
      - name: Install SDK dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Check playback state rules
        run: bash tools/test-state.sh
      - name: Check offline library and playback controls
        run: |
          curl --fail --location https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$RUNNER_TEMP/org-json.jar"
          export GREMLINAMP_JSON_JAR="$RUNNER_TEMP/org-json.jar"
          bash tools/test-library.sh
          bash tools/test-similarity.sh
          bash tools/test-playback.sh
          bash tools/test-update.sh
          bash tools/test-ui.sh
      - name: Import the site decoder bundle
        id: decoder
        env:
          BUNDLE_URL: ${{ inputs.decoder_bundle_url || vars.GREMLINAMP_DECODER_BUNDLE_URL }}
        run: |
          if [[ -z "$BUNDLE_URL" ]]; then
            echo "::notice::No site decoder bundle supplied. Source checks ran; APK build skipped."
            exit 0
          fi
          curl --fail --location --proto '=https' --proto-redir '=https' "$BUNDLE_URL" -o "$RUNNER_TEMP/music_player.zip"
          python3 tools/import-site-engine.py "$RUNNER_TEMP/music_player.zip"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Build development APK
        if: steps.decoder.outputs.ready == 'true'
        env:
          GREMLINAMP_STOREPASS: android
        run: bash tools/build-sdk.sh
      - uses: actions/upload-artifact@v4
        if: steps.decoder.outputs.ready == 'true'
        with:
          name: gremlinamp-development-apk
          path: build/GremlinAmp-*.apk
