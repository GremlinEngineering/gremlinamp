<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101718">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>@TITLE@</title>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <img src="icon-192.png" alt="" width="38" height="38">
    <h1>@TITLE@</h1>
    <span id="connection">Сеть</span>
  </header>
  <main id="app"></main>
  <footer>
    <p id="status" role="status"></p>
    <details>
      <summary>Установка и офлайн</summary>
      <p>В Safari нажмите «Поделиться» → «На экран „Домой“» → «Открывать как веб‑приложение».</p>
      <p id="storage"></p>
      <button id="persist" type="button">Запросить постоянное хранилище</button>
    </details>
  </footer>
</body>
</html>
